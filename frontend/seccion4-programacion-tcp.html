<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misión TCP/IP - Sección 4: Programación TCP</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="card card-wide">
      <div class="status-bar">
        <span class="status-user" id="status-user"></span>
        <span class="status-curso" id="status-curso"></span>
        <span class="status-score">⚡ Sección 4 / 4</span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-label" id="progress-label">0 / 5 respondidas</div>

      <h2 class="section-title">Programación de Servidor y Cliente TCP</h2>

      <div id="quiz-container"></div>

      <div class="btn-group">
        <a href="final.html" class="btn btn-primary" id="next-btn">Finalizar misión</a>
      </div>
    </div>
  </div>

  <script src="assets/js/particles.js"></script>
  <script src="config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/quiz.js"></script>
  <script>
    const questions = [
      {
        question: '¿Por qué se aplica encode() antes de send() y decode() al recibir con recv(), en vez de enviar texto directamente?',
        options: ['Porque los sockets solo transmiten bytes, no cadenas de texto directamente', 'Porque encode() cifra el mensaje por seguridad', 'Porque decode() comprime los datos', 'Son pasos opcionales que solo mejoran el rendimiento']
      },
      {
        question: 'Un cliente ya creó su socket con socket(). ¿Qué instrucción debe ejecutar a continuación para poder enviar datos al servidor?',
        options: ['bind()', 'connect()', 'accept()', 'listen()']
      },
      {
        question: 'Un servidor ya ejecutó socket() y bind(). ¿Qué instrucción falta para que pueda empezar a recibir solicitudes de conexión?',
        options: ['connect()', 'listen()', 'encode()', 'close()']
      },
      {
        question: 'Un desarrollador olvida ejecutar bind() antes de listen(). ¿Qué problema es más probable?',
        options: ['Ninguno, bind() es opcional', 'El socket no tendrá una IP/puerto definidos, por lo que listen() fallará o escuchará en una configuración indefinida', 'El servidor actuará como cliente', 'Los datos se enviarán sin necesidad de conexión']
      },
      {
        question: 'Si el cliente ejecuta close() inmediatamente después de send(), sin llamar a recv(), ¿qué consecuencia tiene?',
        options: ['Ninguna, el mensaje se recibe automáticamente después', 'Cierra la conexión antes de poder leer la respuesta del servidor, perdiendo esa información', 'El servidor no podría procesar el mensaje enviado', 'Se genera un error de bind()']
      }
    ];

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('status-user').textContent = (sessionStorage.getItem('apellidos') || '—') + ' ' + (sessionStorage.getItem('nombres') || '—');
      document.getElementById('status-curso').textContent = (sessionStorage.getItem('curso') || '—');
      if (!sessionStorage.getItem('apellidos')) { window.location.href = 'index.html'; return; }
      QuizEngine.init('s4', questions);
    });
  </script>
</body>
</html>
