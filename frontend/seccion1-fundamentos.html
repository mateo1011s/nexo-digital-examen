  <script>
    const questions = [
      {
        question: '¿Qué capa del modelo TCP/IP contiene protocolos como HTTP, FTP, SMTP y DNS?',
        options: ['Acceso a la Red', 'Internet', 'Transporte', 'Aplicación']
      },
      {
        question: 'Un administrador necesita garantizar que un archivo llegue completo y sin errores entre dos equipos, aunque tome más tiempo. ¿Qué capa y protocolo debe priorizar?',
        options: ['Aplicación – HTTP', 'Transporte – TCP', 'Internet – IP', 'Acceso a la Red – Ethernet']
      },
      {
        question: 'Un correo sale del computador del usuario por SMTP. ¿En qué orden atraviesa las capas, desde que se redacta hasta que sale por la tarjeta de red?',
        options: ['Aplicación → Transporte → Internet → Acceso a la Red', 'Acceso a la Red → Internet → Transporte → Aplicación', 'Transporte → Aplicación → Acceso a la Red → Internet', 'Internet → Acceso a la Red → Aplicación → Transporte']
      },
      {
        question: 'Un paquete llega correctamente a la red de destino (la IP es correcta), pero nunca llega al dispositivo final porque el cable de red está dañado. ¿Qué capa falla, y por qué no es la misma que resolvió el direccionamiento?',
        options: ['Internet, porque también controla el medio físico', 'Acceso a la Red, porque gestiona la infraestructura física local y la transmisión de señales', 'Transporte, porque ahí se controla la conexión física', 'Aplicación, porque ahí se define el hardware usado']
      },
      {
        question: 'Un firewall bloquea todo el tráfico dirigido al puerto 443, pero permite ICMP (ping) y conexiones al puerto 80. Un usuario no puede acceder a un sitio HTTPS aunque el servidor sí responde al ping. ¿Qué capa explica mejor esta falla?',
        options: ['Aplicación', 'Transporte', 'Internet', 'Acceso a la Red']
      }
    ];

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('status-user').textContent = '👤 ' + (sessionStorage.getItem('apellidos') || '—');
      document.getElementById('status-curso').textContent = '📚 ' + (sessionStorage.getItem('curso') || '—');
      if (!sessionStorage.getItem('apellidos')) { window.location.href = 'index.html'; return; }
      QuizEngine.init('s1', questions);
    });
  </script>
