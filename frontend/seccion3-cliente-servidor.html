<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misión TCP/IP - Sección 3: Cliente-Servidor</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="card card-wide">
      <div class="status-bar">
        <span class="status-user" id="status-user"></span>
        <span class="status-curso" id="status-curso"></span>
        <span class="status-score">⚡ Sección 3 / 4</span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-label" id="progress-label">0 / 5 respondidas</div>

      <h2 class="section-title">Arquitectura Cliente-Servidor</h2>

      <div id="quiz-container"></div>

      <div class="btn-group">
        <a href="seccion4-programacion-tcp.html" class="btn btn-primary" id="next-btn">Siguiente misión</a>
      </div>
    </div>
  </div>

  <script src="assets/js/particles.js"></script>
  <script src="config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/quiz.js"></script>
  <script>
    const questions = [
      {
        question: '¿Por qué se dice que el cliente es el "nodo proactivo" y el servidor el "nodo de escucha"?',
        options: ['Porque el servidor tiene mayor capacidad de procesamiento', 'Porque el cliente decide cuándo y a qué IP/puerto solicitar la conexión, mientras el servidor espera pasivamente esa solicitud', 'Porque el servidor no tiene IP fija', 'Por seguridad exigida por TCP']
      },
      {
        question: 'Durante el "canal activo-activo", ¿qué papel juega específicamente accept() del lado del servidor?',
        options: ['Cierra la conexión existente', 'Acepta la solicitud de conexión del cliente y habilita el intercambio bidireccional', 'Configura la IP del servidor', 'Convierte el mensaje a bytes']
      },
      {
        question: 'Dos clientes distintos se conectan al mismo servidor al mismo tiempo, apuntando a la misma IP y puerto del servidor. ¿Por qué el servidor puede atender ambas conexiones sin mezclar los datos?',
        options: ['Porque el servidor duplica su IP para cada cliente', 'Porque cada conexión aceptada genera un socket distinto, diferenciado también por la IP y el puerto del cliente que se conectó', 'Porque solo puede atender una a la vez y la segunda espera en cola indefinidamente', 'Porque UDP separa automáticamente las conexiones']
      },
      {
        question: 'El servidor cae justo después de ejecutar listen(), pero antes de que un cliente intente conectarse. ¿Qué pasa cuando el cliente intenta conectarse mientras el servidor está caído?',
        options: ['Se conecta usando el socket anterior', 'La conexión falla, porque no hay ningún proceso escuchando en ese puerto', 'El servidor se reinicia automáticamente', 'El cliente pasa a actuar como servidor']
      },
      {
        question: 'Un servidor intercambia datos con un cliente pero nunca ejecuta close(). ¿Qué consecuencia tiene esto a mediano plazo si recibe muchas conexiones?',
        options: ['Ninguna, el sistema libera recursos automáticamente', 'Se agotan progresivamente los recursos del sistema, afectando la capacidad de atender nuevas conexiones', 'El servidor empieza a actuar como cliente', 'Los datos futuros llegan duplicados']
      }
    ];

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('status-user').textContent = (sessionStorage.getItem('apellidos') || '—') + ' ' + (sessionStorage.getItem('nombres') || '—');
      document.getElementById('status-curso').textContent = (sessionStorage.getItem('curso') || '—');
      if (!sessionStorage.getItem('apellidos')) { window.location.href = 'index.html'; return; }
      QuizEngine.init('s3', questions);
    });
  </script>
</body>
</html>
