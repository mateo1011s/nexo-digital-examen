  <div class="container">
    <div class="card card-wide">
      <div class="status-bar">
        <span class="status-user" id="status-user"></span>
        <span class="status-curso" id="status-curso"></span>
        <span class="status-score">⚡ Sección 2 / 4</span>

        <div class="progress-fill" id="progress-fill"></div>

      <h2 class="section-title">Sockets y Protocolos de Transporte</h2>

      <div id="quiz-container"></div>

      <div class="btn-group">
        <a href="seccion3-cliente-servidor.html" class="btn btn-primary" id="next-btn">Siguiente misión</a>

  <script src="assets/js/particles.js"></script>
  <script src="config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/quiz.js"></script>
  <script>
    const questions = [
      {
        question: '¿Qué es un socket dentro de una comunicación en red?',
        options: ['Un cable físico de conexión', 'Una interfaz que permite la comunicación activa entre procesos o dispositivos', 'Un tipo de dirección MAC', 'Un servidor de nombres de dominio (DNS)']
      },
      {
        question: 'Dos aplicaciones distintas corren en el mismo servidor y comparten la misma IP. Un cliente logra comunicarse con la correcta y no con la otra. ¿Qué elemento de la tríada hace posible esa distinción?',
        options: ['El protocolo', 'El número de puerto', 'La dirección IP', 'La dirección MAC']
      },
      {
        question: 'Una videollamada transmite audio/video en tiempo real; puede perder algunos fragmentos sin arruinar la experiencia, pero no tolera retrasos largos. ¿Qué protocolo conviene y por qué?',
        options: ['TCP, porque garantiza la entrega de todos los paquetes', 'UDP, porque prioriza la velocidad sobre la garantía de entrega', 'TCP, porque no requiere conexión previa', 'UDP, porque reenvía automáticamente los paquetes perdidos']
      },
      {
        question: 'Dos conexiones comparten la misma IP y el mismo puerto, pero una usa TCP y otra UDP. ¿Son el mismo socket o sockets distintos?',
        options: ['Son el mismo socket, porque IP y puerto ya los identifican', 'Son sockets distintos, porque el protocolo también forma parte de la identificación única', 'Son el mismo socket solo si están en la misma red', 'No se puede determinar sin conocer el sistema operativo']
      },
      {
        question: 'Dentro de la tríada del socket, ¿qué representa la IP en comparación con el puerto?',
        options: ['La IP identifica el proceso y el puerto identifica el dispositivo', 'La IP identifica el dispositivo dentro de la red y el puerto identifica el proceso o aplicación específica dentro de ese dispositivo', 'Ambos identifican lo mismo', 'La IP identifica el protocolo y el puerto la ruta']
      }
    ];

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('status-user').textContent = (sessionStorage.getItem('apellidos') || '—') + ' ' + (sessionStorage.getItem('nombres') || '—'); 
      document.getElementById('status-curso').textContent = (sessionStorage.getItem('curso') || '—');
      if (!sessionStorage.getItem('apellidos')) { window.location.href = 'index.html'; return; }
      QuizEngine.init('s2', questions);
    });
  </script>
